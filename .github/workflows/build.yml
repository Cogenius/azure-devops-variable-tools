name: Build

on:
  push:
    branches: [master, main, develop, 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the extension to the Visual Studio Marketplace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run install:tasks

      - name: Build
        run: npm run build

      - name: Test
        shell: pwsh
        run: ./tests/run-tests.ps1 -OutputFile test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Install dependencies
        run: |
          npm ci
          npm run install:tasks

      - name: Build
        run: npm run build

      - name: Set version ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: node scripts/set-version.js ${{ steps.gitversion.outputs.majorMinorPatch }}

      - name: Package extension
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to Marketplace
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - name: Publish extension
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        run: |
          if [ -z "$AZURE_DEVOPS_EXT_PAT" ]; then
            echo "::error::The AZURE_DEVOPS_EXT_PAT secret is not configured."
            exit 1
          fi
          npx --yes tfx-cli@0.24.2 extension publish --vsix dist/*.vsix --auth-type pat --token "$AZURE_DEVOPS_EXT_PAT" --no-prompt
